<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b2436" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Heft">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Heft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ============ Bibliothek ============ -->
  <section id="bibliothek" class="ansicht">
    <header class="bib-kopf">
      <div class="bib-zeile">
        <button class="knopf" id="ordner-zurueck" hidden aria-label="Zurück"></button>
        <div class="bib-rechts">
          <button class="knopf wolke" id="wolke" aria-label="Abgleich" hidden></button>
          <button class="knopf" id="auswahl-modus" aria-label="Auswählen" title="Auswählen">Auswählen</button>
        </div>
      </div>
      <h1 id="bib-titel">Dokumente</h1>
      <div class="segment" id="sortierung">
        <button data-s="datum">Datum</button><button data-s="titel">Titel</button><button data-s="art">Art</button>
      </div>
    </header>
    <div id="raster" class="raster"></div>
    <div id="suchseite" class="suchseite" hidden>
      <label class="suchfeld"><span class="lupe"></span><input id="suche" type="search" placeholder="Titel und Text durchsuchen"></label>
      <div id="suchergebnisse"></div>
    </div>
    <nav class="tableiste" id="tableiste">
      <button data-tab="dokumente" class="an"><span class="ic"></span>Dokumente</button>
      <button data-tab="suche"><span class="ic"></span>Suche</button>
      <button data-tab="favoriten"><span class="ic"></span>Favoriten</button>
    </nav>
  </section>

  <!-- ============ Editor ============ -->
  <section id="editor" class="ansicht" hidden>
    <header class="ed-kopf">
      <div class="gruppe" id="kopf-links"></div>
      <button class="titel-knopf" id="heft-titel"><span></span></button>
      <div class="gruppe rechts" id="kopf-rechts"></div>
    </header>
    <nav class="dok-tabs" id="dok-tabs"></nav>
    <div class="werkzeugreihe" id="werkzeugreihe">
      <div class="werkzeuge" id="werkzeuge"></div>
      <div class="schnell" id="schnell"></div>
    </div>
    <div class="arbeitsflaeche">
      <aside id="seitenleiste" class="seitenleiste" hidden></aside>
      <div id="blatt-bereich" class="blatt-bereich">
        <div id="seiten" class="seiten"></div>
      </div>
    </div>
    <div id="zoomfenster" class="zoomfenster" hidden>
      <div class="zf-griff"></div>
      <div class="zf-leiste">
        <div class="gruppe"><button class="knopf" data-zf="rand" title="Zum linken Rand"></button><button class="knopf" data-zf="zeile" title="Neue Zeile"></button></div>
        <div class="gruppe"><button class="knopf" data-zf="zu" title="Zoom-Fenster schließen"></button></div>
      </div>
      <canvas id="zf-canvas"></canvas>
      <div class="zf-weiter" title="Hier weiterschreiben: Fenster rückt automatisch weiter"></div>
    </div>
    <div id="seitenzahl" class="seitenzahl"></div>
  </section>

  <div id="popover" class="popover" hidden></div>
  <div id="menue" class="menue" hidden></div>
  <div id="dialog" class="dialog" hidden><div class="dialog-hinter"></div><div class="dialog-box"></div></div>
  <div id="hinweis" class="hinweis" hidden></div>
  <input type="file" id="datei-pdf" accept="application/pdf" hidden>
  <input type="file" id="datei-bild" accept="image/*" hidden>
  <input type="file" id="datei-schrift" accept=".ttf,.otf,.woff,.woff2,font/*" hidden>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
