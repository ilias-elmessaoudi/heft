<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Heft">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Heft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bibliothek -->
  <section id="bibliothek" class="ansicht">
    <header class="leiste">
      <div class="leiste-links">
        <button class="knopf" id="ordner-zurueck" hidden aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <h1 id="bib-titel">Dokumente</h1>
      </div>
      <div class="leiste-rechts">
        <label class="suche"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="suche" type="search" placeholder="Suchen"></label>
        <button class="knopf" id="sortieren" aria-label="Sortieren" title="Sortieren"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
      </div>
    </header>
    <div id="raster" class="raster"></div>
    <button id="neu" class="neu-knopf" aria-label="Neu"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>

  <!-- Editor -->
  <section id="editor" class="ansicht" hidden>
    <header class="werkzeugleiste">
      <div class="gruppe">
        <button class="knopf" data-befehl="schliessen" aria-label="Zur Bibliothek" title="Zur Bibliothek"><svg viewBox="0 0 24 24"><path d="M4 5h6v6H4zM14 5h6v6h-6zM4 15h6v6H4zM14 15h6v6h-6z"/></svg></button>
        <button class="knopf" data-befehl="seitenleiste" aria-label="Seitenübersicht" title="Seitenübersicht"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <span class="heft-titel" id="heft-titel" title="Umbenennen"></span>
      </div>
      <div class="gruppe werkzeuge" id="werkzeuge">
        <button class="werkzeug" data-werkzeug="stift" title="Stift (P)"><svg viewBox="0 0 24 24"><path d="M4 20l1.5-5L16 4.5a2.1 2.1 0 0 1 3 3L8.5 18z"/><path d="M14 6.5l3 3"/></svg></button>
        <button class="werkzeug" data-werkzeug="marker" title="Textmarker (H)"><svg viewBox="0 0 24 24"><path d="M9 14l-3 3v3h3l3-3"/><path d="M9 14l7-9 4 3-7 9z"/><path d="M4 21h16" class="farbstrich"/></svg></button>
        <button class="werkzeug" data-werkzeug="radierer" title="Radierer (E)"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.5 15.5 14 6a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 20H8.5z"/><path d="m9 11 6 6"/></svg></button>
        <button class="werkzeug" data-werkzeug="lasso" title="Lasso (L)"><svg viewBox="0 0 24 24"><path d="M7 16c-2.5-1.2-4-3-4-5 0-3.9 4-7 9-7s9 3.1 9 7-4 7-9 7c-1.3 0-2.5-.2-3.6-.6" stroke-dasharray="3 2.5"/><path d="M7 16c0 2 1 4 3 4"/></svg></button>
        <button class="werkzeug" data-werkzeug="form" title="Formen (S)"><svg viewBox="0 0 24 24"><rect x="3.5" y="10" width="10" height="10" rx="1"/><circle cx="16" cy="8" r="4.5"/></svg></button>
        <button class="werkzeug" data-werkzeug="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6"/></svg></button>
        <button class="werkzeug" data-befehl="bild" title="Bild einfügen"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 2.5-2.5L20 19"/></svg></button>
        <span class="trenner"></span>
        <div id="optionen" class="optionen"></div>
      </div>
      <div class="gruppe">
        <button class="knopf" data-befehl="rueckgaengig" aria-label="Rückgängig" title="Rückgängig (Strg+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="knopf" data-befehl="wiederholen" aria-label="Wiederholen" title="Wiederholen (Strg+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
        <button class="knopf" data-befehl="mehr" aria-label="Mehr" title="Seite, Export, Einstellungen"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      </div>
    </header>
    <div class="arbeitsflaeche">
      <aside id="seitenleiste" class="seitenleiste" hidden></aside>
      <div id="blatt-bereich" class="blatt-bereich">
        <div id="seiten" class="seiten"></div>
      </div>
    </div>
    <div id="seitenzahl" class="seitenzahl"></div>
  </section>

  <div id="menue" class="menue" hidden></div>
  <div id="dialog" class="dialog" hidden><div class="dialog-hinter"></div><div class="dialog-box"></div></div>
  <div id="hinweis" class="hinweis" hidden></div>
  <input type="file" id="datei-pdf" accept="application/pdf" hidden>
  <input type="file" id="datei-bild" accept="image/*" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
